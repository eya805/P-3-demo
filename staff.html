<!doctype html>
<html lang="en" dir="ltr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>BloodNet — Staff Application (Demonstration)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f4f6f9;--ink:#14202e;--mute:#58677a;--line:#d6dde6;--navy:#0f2b46;--navy2:#1b4468;--red:#b01f2d;--ok:#17714a;--warn:#9a5b00;--soft:#e8edf3;--focus:#0a58ca;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.55 "IBM Plex Sans",Arial,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}}
aside{background:var(--navy);color:#dbe6f1;padding:14px 10px}
aside h1{font-size:20px;margin:0 6px;color:#fff}aside .sub{margin:0 6px 10px;font-size:12px;color:#9fb6cc}
.dm{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#9fb6cc;margin:12px 6px 4px}
.rl{display:block;width:100%;text-align:left;background:none;border:0;color:#dbe6f1;padding:6px 10px;border-radius:6px;margin:1px 0}
.rl.on{background:var(--navy2);color:#fff;font-weight:600}.rl small{display:block;color:#9fb6cc;font-weight:400;font-size:12px}
aside a{color:#fff;font-size:13px;margin:10px 6px;display:block}
.demo{background:#7a1420;color:#fff;font-size:13px;font-weight:500;padding:6px 20px}
main{min-width:0}.pad{padding:16px 22px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px}.top h2{margin:0;font-size:21px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 16px;color:var(--mute);font-weight:500}.tabs .on{color:var(--ink);border-color:var(--red);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:15.5px}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mute{color:var(--mute)}.ok{color:var(--ok);font-weight:600}.no{color:var(--red);font-weight:600}.wn{color:var(--warn);font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
label{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:13px}label i{font-weight:400;font-style:normal;color:var(--mute)}
input,select{border:1px solid #9fb0c2;border-radius:5px;padding:8px 10px;background:#fff;color:var(--ink);font:inherit;width:100%;min-height:40px}
.btn{background:var(--red);color:#fff;border:0;border-radius:5px;padding:8px 16px;font-weight:600;min-height:40px;margin:2px 0}.btn.s{background:#fff;color:var(--navy);border:1px solid #9fb0c2}.btn.k{background:var(--ok)}.btn[disabled]{opacity:.45;cursor:default}
.pill{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:0 10px;font-size:12px;font-weight:600}.p-Urgent{color:var(--warn)}.p-Emergency{color:var(--red)}.p-Routine{color:var(--mute)}
.bg{display:inline-block;min-width:2.8em;text-align:center;background:var(--red);color:#fff;border-radius:4px;padding:0 7px;font-weight:700}.bg.off{background:#7d8a99}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mute);background:var(--soft)}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.life{height:8px;width:100px;border-radius:4px;background:var(--soft);overflow:hidden}.life i{display:block;height:100%;background:var(--ok)}.life.w i{background:var(--warn)}.life.d i{background:var(--red)}
.chk{display:flex;gap:8px;align-items:center;padding:3px 0}.sum{display:flex;gap:28px;flex-wrap:wrap}.sum b{font-size:24px;display:block;line-height:1.1}
.offer{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:9px 0;flex-wrap:wrap}
#dlg{position:fixed;inset:0;background:rgba(15,43,70,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}#dlg[hidden]{display:none}
#dlg .b{background:#fff;border-radius:10px;padding:20px;max-width:480px;width:100%}.big{font-size:19px;font-weight:600;line-height:1.5}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;margin:auto;width:max-content;max-width:92%;background:var(--navy);color:#fff;padding:9px 20px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}#toast.on{opacity:1}#toast.bad{background:#8e1220}
</style>
</head>
<body>
<div class="app">
<aside><h1>BloodNet</h1><p class="sub">Staff application</p><div class="dm">Demo role switcher</div><nav id="roles" aria-label="Demo role switcher"></nav>

</div>
<div id="dlg" hidden role="dialog" aria-modal="true"><div class="b"><div id="dlgb"></div><p style="text-align:right;margin:14px 0 0"><button class="btn s" onclick="dlg()">Go back</button> <button class="btn" onclick="dlgOk()">Confirm</button></p></div></div>
<div id="toast" role="status"></div>
<script type="application/json" id="data">
{"units":[["BN-0413","prbc","A+",3,"Released"],["BN-0431","prbc","A+",35,"Released"],["BN-0450","prbc","O-",4,"Reserved"],["BN-0455","prbc","O-",26,"Reserved"],["BN-0460","prbc","O-",30,"Released"],["BN-0470","plt","A+",2,"Released"],["BN-0480","ffp","B+",120,"Released"],["BN-0399","prbc","A+",-1,"Expired"],["BN-0500","prbc","?",35,"Quarantined"],["BN-0501","prbc","?",35,"Quarantined",1,0],["BN-0502","prbc","?",35,"Quarantined",1,1]],
"remote":{"2":{"prbc:O-":[3,9],"prbc:A+":[8,12]},"3":{"prbc:O-":[6,14],"prbc:A+":[9,18]}},
"cen":{"1":["Regional Blood Bank, Damanhour",3.2,20],"2":["Kafr El-Dawwar Blood Bank",24,35],"3":["Alexandria Central Blood Bank",62,78]},
"kb":[{"id":1,"q":"How do I donate blood?","st":"Published","by":"Rania Mostafa"},{"id":2,"q":"What documents do I need?","st":"Published","by":"Rania Mostafa"},{"id":3,"q":"How often can I donate?","st":"In review","by":"Rania Mostafa"}],
"acc":[{"n":"Sara Hassan","r":"lab_tech","st":"active"},{"n":"Hany Fathy","r":"center_physician","st":"active"},{"n":"Youssef Adel","r":"treating_doctor","st":"pending_verification","lic":"TD-2291"}]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),$=s=>document.querySelector(s);
const COMP={prbc:'Packed Red Blood Cells (PRBC)',plt:'Platelet Concentrate',ffp:'Fresh Frozen Plasma (FFP)'},GR=['A+','A-','B+','B-','AB+','AB-','O+','O-'],INF=[['hbsag','HBsAg'],['hcv','HCV Ab'],['hiv','HIV 1+2 Ab'],['syph','Syphilis Ab']];
const CEN='Damanhour University Hospital Blood Center',HOSP='Damanhour University Hospital';
const U={doctor:['Dr. Mona El-Sayed','Treating Doctor',HOSP,[['d-new','New request'],['d-req','My requests']]],nurse:['Nour Adel','Reception Nurse',CEN,[['n-in','Donor check-in'],['n-col','Collection']]],phys:['Dr. Hany Fathy','Center Physician',CEN,[['c-don','Donor decisions'],['c-rel','Release units']]],labA:['Sara Hassan','Lab Technician',CEN,[['l-res','Unit results'],['l-xm','Typing and crossmatch']]],labB:['Omar Nabil','Lab Technician',CEN,[['l-res','Unit results'],['l-xm','Typing and crossmatch']]],mgr:['Khaled Abdullah','Blood Bank Manager',CEN,[['m-in','Incoming requests'],['m-stk','Stock and lookup'],['m-ful','Fulfilment']]],fadm:['Ahmed Samir','Facility Admin',HOSP,[['f-acc','Staff accounts']]],sadA:['Rania Mostafa','System Admin','Ministry-level administration',[['s-pol','Policy rules'],['s-bot','Chatbot content'],['s-aud','Audit log']]],sadB:['Tarek Fouad','System Admin','Ministry-level administration',[['s-pol','Policy rules'],['s-bot','Chatbot content'],['s-aud','Audit log']]]};
const P={minAge:18,maxAge:60,minW:50,hbM:13,hbF:12,hbMax:18,gapM:90,gapF:120,hold:60,maxEta:60};
const mk=u=>({code:u[0],k:u[1],g:u[2],d:u[3],s:u[4],res:u[5]?{abo:'O-',hbsag:'Negative',hcv:'Negative',hiv:'Negative',syph:'Negative'}:null,by:u[5]?'Sara Hassan':'',rev:u[6]?'Omar Nabil':''});
const S={u:'doctor',scr:'d-new',pv:1,units:D.units.map(mk),audit:[],pt:null,print:null,next:1046,un:520,vn:3,drafts:[],kb:D.kb,acc:D.acc,
 reqs:[{id:1042,ref:'PR-1042',own:1,pn:'Mahmoud Ibrahim',k:'prbc',g:'O-',q:2,pr:'Urgent',st:'Covered',to:[1,2],offers:[{c:1,qty:2,days:4,u:['BN-0450','BN-0455'],st:'approved'}],f:{}},{id:1044,ref:'PR-1044',own:0,k:'prbc',g:'A+',q:3,pr:'Routine',st:'Open',to:[1],offers:[],f:{}},{id:1045,ref:'PR-1045',own:0,k:'prbc',g:'O-',q:1,pr:'Urgent',st:'Open',to:[1],offers:[],f:{}}],
 visits:[{id:'V-1',idm:'•••• 0012',sex:'M',age:25,w:70,hb:14,gap:180,st:'Awaiting physician'},{id:'V-2',idm:'•••• 0034',sex:'M',age:31,w:82,hb:12.5,gap:200,st:'Awaiting physician'}]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bg=g=>g=='?'?'<b class="bg off">Not typed</b>':`<b class="bg" dir="ltr">${g.replace('-','−')}</b>`,gn=g=>g.slice(0,-1)+(g.slice(-1)=='+'?' Rh-positive':' Rh-negative');
const dt=d=>new Date(Date.now()+d*864e5).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),me=()=>U[S.u][0];
const sel=(id,o,v,ph)=>`<select id="${id}">${ph?`<option value="">${ph}</option>`:''}${o.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('')}</select>`;
const life=d=>`<div class="life ${d<=7?'d':d<=14?'w':''}"><i style="width:${Math.max(0,Math.min(100,d/40*100))}%"></i></div><small class="mute">${d} days, ${dt(d)}</small>`;
const unit=c=>S.units.find(u=>u.code==c),req=i=>S.reqs.find(r=>r.id==i),V=id=>$('#'+id).value;
function aud(a,d,ok){S.audit.unshift({t:new Date().toLocaleTimeString('en-GB'),u:me(),r:U[S.u][1],a,d,ok:ok!==0})}
function toast(t,bad){const e=$('#toast');e.textContent=t;e.className='on'+(bad?' bad':'');clearTimeout(toast.h);toast.h=setTimeout(()=>e.className='',3200)}
function deny(m,a){aud(a||'denied',m,0);toast(m,1)}
function ok(m,a,d){aud(a,d||m);toast(m);render()}
function dlg(h,f){if(!h){$('#dlg').hidden=true;return}$('#dlgb').innerHTML=h;S.fn=f;$('#dlg').hidden=false}
function dlgOk(){const f=S.fn;$('#dlg').hidden=true;if(f)f()}
function setU(k){S.u=k;S.scr=U[k][3][0][0];render()}
function go(s){S.scr=s;render()}
function render(){
 const g={};Object.entries(U).forEach(([k,v])=>(g[v[1]]=g[v[1]]||[]).push(k));
 $('#roles').innerHTML=Object.entries(g).map(([r,ks])=>`<div class="dm">${r}</div>`+ks.map(k=>`<button class="rl${k==S.u?' on':''}" onclick="setU('${k}')">${U[k][0]}<small>${U[k][2]}</small></button>`).join('')).join('');
 const u=U[S.u];$('#main').innerHTML=`<div class="top"><h2>${u[1]}</h2><span class="mute">${u[0]}, ${u[2]}</span></div><div class="tabs">${u[3].map(([k,l])=>`<button class="${k==S.scr?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div>`+SCR[S.scr]()}
const rules=v=>{const m=v.sex=='M';return[['Age',v.age>=P.minAge&&v.age<=P.maxAge,`${P.minAge} to ${P.maxAge} years`],['Weight',v.w>=P.minW,`at least ${P.minW} kg`],['Haemoglobin',v.hb>=(m?P.hbM:P.hbF)&&v.hb<=P.hbMax,`${m?P.hbM:P.hbF} to ${P.hbMax} g/dL`],['Interval since last donation',v.gap>=(m?P.gapM:P.gapF),`at least ${m?P.gapM:P.gapF} days`]]};
const rtab=R=>`<table>${R.map(r=>`<tr><td>${r[0]}</td><td class="${r[1]?'ok':'no'}">${r[1]?'Pass':'Fail'}</td><td class="mute">${r[2]}</td></tr>`).join('')}</table>`;

/* Treating doctor */
function dNew(){const p=S.pt;return `<div class="card"><h3>New blood request</h3><div class="g"><label>Patient national ID<i>14 digits, synthetic IDs only</i><input id="f-i" maxlength="14" inputmode="numeric" value="${p?p.id:''}"></label><label>&nbsp;<button class="btn s" onclick="lookup()">Look up patient</button></label></div>
${p?(p.known?'<p class="ok">Known patient: Mahmoud Ibrahim, Damanhour. Name and address filled in.</p>':'<div class="g" style="margin-top:8px"><label>Patient name<input id="f-n"></label><label>Address<input id="f-a"></label></div>'):''}</div>
<div class="card"><div class="g"><label>Blood component${sel('f-k',Object.values(COMP),COMP.prbc)}</label><label>Blood group, ABO and Rh${sel('f-g',GR,'','Select group')}</label><label>Quantity<i>units</i><input id="f-q" type="number" min="1"></label><label>Priority${sel('f-p',['Emergency','Urgent','Routine'],'Urgent')}</label><label>Haemoglobin<i>g/dL, optional</i><input id="f-h" type="number" step="0.1"></label><label>Indication<i>optional</i>${sel('f-c',['Anaemia','Acute haemorrhage','Peri-operative'],'','None')}</label></div>
<p style="margin-bottom:0"><button class="btn" onclick="verify()">Review request</button></p></div>`}
function lookup(){const id=V('f-i').trim();if(!/^\d{14}$/.test(id))return deny('National ID must be 14 digits','request.lookup');if(id.slice(7,9)!='00')return deny('Demo mode accepts synthetic IDs only (governorate code 00)','request.lookup');S.pt={id,known:id=='29901010012345'};aud('patient.lookup','POST body, ID not logged');render()}
function verify(){if(!S.pt)return deny('Look up the patient first');const g=V('f-g'),q=+V('f-q'),k=Object.keys(COMP).find(x=>COMP[x]==V('f-k')),p=V('f-p');
 if(!S.pt.known&&(!V('f-n').trim()||!V('f-a').trim()))return deny('Patient name and address are required','request.create');
 if(!g)return deny('Blood group is required','request.create');if(!(q>=1))return deny('Quantity must be 1 or more','request.create');
 const pn=S.pt.known?'Mahmoud Ibrahim':V('f-n').trim();
 dlg(`<h3 style="margin:0 0 8px">Verify before sending</h3><p class="big">${q} unit${q>1?'s':''} of ${COMP[k]}<br>${bg(g)} ${gn(g)}<br><span class="pill p-${p}">${p}</span></p><p class="mute">Centers will see a patient reference only.</p>`,()=>submit({k,g,q,pr:p,pn}))}
function submit(v){const r={id:S.next,ref:'PR-'+S.next++,own:1,...v,st:'Open',to:[1,2],offers:[],f:{}};S.reqs.unshift(r);S.pt=null;S.print=r;aud('request.create',r.ref+' routed to round 1 (centers within 25 km)');S.scr='d-req';render();
 [[2,1500],[3,3500]].forEach(([c,t])=>setTimeout(()=>{const s=D.remote[c][r.k+':'+r.g];if(s&&r.st=='Open'){r.offers.push({c,qty:Math.min(r.q,s[0]),days:s[1],st:'offered'});if(c==3)aud('request.widen',r.ref+' widened to round 2');if(S.scr=='d-req')render()}},t))}
function dReq(){const ps=S.print;S.print=null;return (ps?`<div class="card" style="border-color:var(--ok)"><b>Request ${ps.ref} created with status Open.</b> The request form is ready to print.<p class="mute" style="margin:4px 0 0"><button class="btn s" onclick="aud('form.print','${ps.ref} printed');toast('Print recorded')">Print request form</button></p></div>`:'')+S.reqs.filter(r=>r.own).map(r=>`<div class="card"><div class="row"><h3>${r.ref}</h3><span><span class="pill p-${r.pr}">${r.pr}</span> <b>${r.st}</b></span></div><p style="margin:0">${r.q} unit${r.q>1?'s':''} ${bg(r.g)} ${COMP[r.k]}</p>
${r.offers.map((o,i)=>{const c=D.cen[o.c],ov=c[2]>P.maxEta;return `<div class="offer"><div><b>${c[0]}</b><br><small class="mute">${o.qty} unit${o.qty>1?'s':''}, ${c[1]} km, arrival ${c[2]} min (Estimate), unit expiry ${dt(o.days)}</small>${ov?'<br><span class="wn">Over advisory transport time</span>':''}</div>${o.st=='approved'?'<span class="ok">Approved</span>':o.st=='superseded'?'<span class="mute">Superseded</span>':`<button class="btn" ${['Covered','InFulfilment','Completed','Cancelled'].includes(r.st)?'disabled':''} onclick="appr(${r.id},${i})">Approve</button>`}</div>`}).join('')}
${r.offers.length?'':'<p class="mute">Routed to centers within 25 km. No reply yet.</p>'}
${r.f.dispatched?r.offers.filter(o=>o.st=='approved').flatMap(o=>o.u||[]).map(c=>{const u=unit(c);return u.s=='InTransit'?`<div class="offer"><span>${c} in transit</span><span><button class="btn k" onclick="recv('${c}',1)">Confirm OK</button> <button class="btn s" onclick="recv('${c}',0)">Report deviation</button></span></div>`:`<div class="offer"><span>${c}</span><b>${u.s}</b></div>`}).join(''):''}
${['Open','Covered','InFulfilment'].includes(r.st)?`<p style="margin:8px 0 0"><button class="btn s" onclick="cancel(${r.id})">Cancel request</button></p>`:''}</div>`).join('')}
function appr(id,i){const r=req(id),o=r.offers[i],c=D.cen[o.c];const go2=why=>{o.st='approved';r.offers.forEach((x,j)=>{if(j!=i&&x.st!='approved'){x.st='superseded';(x.u||[]).forEach(k=>unit(k).s='Released')}});r.st=o.qty>=r.q?'Covered':'Open';ok(o.qty>=r.q?'Offer approved. Request is Covered':'Partial approval. The remainder keeps being routed','offer.approve',r.ref+(why?' override: '+why:''))};
 if(c[2]>P.maxEta)dlg(`<h3 style="margin:0 0 8px">Over advisory transport time</h3><p>Estimated arrival is ${c[2]} minutes. Enter a reason to approve anyway.</p><input id="why" placeholder="Reason">`,()=>{const w=V('why').trim();if(!w)return deny('Reason is required','offer.approve');go2(w)});
 else dlg(`<h3 style="margin:0 0 8px">Approve this offer?</h3><p class="big">${r.q} unit${r.q>1?'s':''} ${bg(r.g)}</p><p class="mute">${c[0]}, ${o.qty} unit${o.qty>1?'s':''}, arrival ${c[2]} min (Estimate).</p>`,()=>go2(''))}
function cancel(id){const r=req(id);dlg(`<h3 style="margin:0 0 8px">Cancel ${r.ref}?</h3><p class="mute">${r.f.dispatched?'Units already on the road must still be accounted for. The request becomes CancelRequested.':'Reserved units return to stock.'}</p>`,()=>{if(r.f.dispatched){r.st='CancelRequested'}else{r.offers.forEach(o=>(o.u||[]).forEach(c=>{const u=unit(c);if(u.s=='Reserved')u.s='Released';if(u.s=='Issued')u.s='Returned'}));r.st='Cancelled'}ok('Request '+r.st,'request.cancel',r.ref)})}
function recv(c,good){const u=unit(c),r=S.reqs.find(x=>x.offers.some(o=>(o.u||[]).includes(c)));if(good&&u.d<=0)return deny('Unit expired in transit. Report it as a deviation','unit.receive');u.s=good?'Received':'Returned';const all=r.offers.filter(o=>o.st=='approved').flatMap(o=>o.u);if(all.every(k=>unit(k).s=='Received'))r.st='Completed';ok(good?'Unit received':'Unit returned to the blood bank','unit.receive',c+' '+u.s)}

/* Blood bank manager */
const pool=r=>S.units.filter(u=>u.k==r.k&&u.g==r.g&&u.s=='Released'&&u.d>0).sort((a,b)=>a.d-b.d);
function mIn(){const L=S.reqs.filter(r=>r.to.includes(1)&&r.st=='Open'&&!r.offers.some(o=>o.c==1));return L.length?L.map(r=>{const a=pool(r).length;return `<div class="card"><div class="row"><h3>${r.ref}</h3><span class="pill p-${r.pr}">${r.pr}</span></div><p style="margin:0">${r.q} unit${r.q>1?'s':''} ${bg(r.g)} ${COMP[r.k]}. Patient reference only, no identity.</p><p class="mute" style="margin:2px 0 6px">Released units here: ${a}</p><button class="btn k" ${a>=r.q?'':'disabled'} onclick="accept(${r.id},${r.q})">Accept in full</button> <button class="btn s" ${a>0&&a<r.q?'':'disabled'} onclick="accept(${r.id},${a})">Accept in part (${a})</button> <input id="dc${r.id}" placeholder="Decline reason" style="width:190px;display:inline-block"><button class="btn s" onclick="decline(${r.id})">Decline</button></div>`}).join(''):'<div class="card">No requests waiting for an answer.</div>'}
function accept(id,n){const r=req(id),a=pool(r).slice(0,n);if(a.length<n)return deny('This unit is already reserved','offer.reserve');a.forEach(u=>u.s='Reserved');r.offers.push({c:1,qty:n,days:a[0].d,u:a.map(u=>u.code),st:'offered'});ok(`Offer sent: ${n} unit${n>1?'s':''} reserved (closest to expiry first). Held for ${P.hold} minutes`,'offer.create',r.ref)}
function decline(id){const w=V('dc'+id).trim();if(!w)return deny('Reason is required','offer.decline');const r=req(id);r.to=r.to.filter(c=>c!=1);ok('Request declined','offer.decline',r.ref+': '+w)}
function mStk(){const c=s=>S.units.filter(u=>u.s==s).length,ex=S.units.filter(u=>u.s=='Expired'),l=S.look;
 return `<div class="card"><h3>Unit lookup</h3><div class="row" style="justify-content:flex-start"><input id="lk" placeholder="Unit code, e.g. BN-0460" style="width:240px"><button class="btn" onclick="look()">Search</button></div>${l===null?'<p class="no">Unit not found</p>':l?`<p style="margin:8px 0 0"><b>${l.code}</b> ${bg(l.g)} ${COMP[l.k]}, status <b>${l.s}</b>, expires ${dt(l.d)}. Donor identity is hidden.</p>`:''}</div>
<div class="card"><div class="sum"><div><b>${c('Released')}</b>Released</div><div><b>${c('Reserved')}</b>Reserved</div><div><b>${c('Quarantined')}</b>Quarantined</div><div><b>${c('Expired')}</b>Expired, to remove</div></div></div>
${ex.length?`<div class="card" style="border-color:var(--red)"><h3>Expired units still in custody</h3>${ex.map(u=>`<div class="offer"><span>${u.code} ${bg(u.g)} ${COMP[u.k]}</span><button class="btn" onclick="rm('${u.code}')">Confirm removed from fridge</button></div>`).join('')}</div>`:''}
<div class="card sc"><table><tr><th>Unit</th><th>Component</th><th>Group</th><th>Status</th><th>Shelf life</th></tr>${[...S.units].filter(u=>u.s!='Discarded').sort((a,b)=>a.d-b.d).map(u=>`<tr><td>${u.code}</td><td>${COMP[u.k]}</td><td>${bg(u.g)}</td><td>${u.s}</td><td>${life(u.d)}</td></tr>`).join('')}</table></div>`}
function look(){S.look=unit(V('lk').trim().toUpperCase())||null;aud('unit.lookup',V('lk'));render()}
function rm(c){unit(c).s='Discarded';ok('Unit removed and logged as Discarded','unit.discard',c+' expired')}
const fq=r=>r.offers.find(o=>o.c==1&&o.st=='approved');
function mFul(){const L=S.reqs.filter(r=>fq(r)&&!['Cancelled','Completed'].includes(r.st));return L.length?L.map(r=>{const f=r.f,o=fq(r),us=o.u.map(unit),ready=f.xm&&f.xm.rev&&f.xm.v=='Compatible';
 return `<div class="card"><div class="row"><h3>${r.ref}</h3><b>${r.st}</b></div><p class="mute" style="margin:0">${r.q} unit${r.q>1?'s':''} ${bg(r.g)}. ${f.sample=='accepted'?'Patient: <b>'+esc(r.pn)+'</b> (shown to this center only).':'Patient identity is hidden until the sample is accepted.'}</p>
<div class="chk">1. Signed paper request ${f.paper?'<span class="ok">Verified</span>':'<button class="btn s" onclick="paper(${r.id})">Mark received and verified</button>'.replace('${r.id}',r.id)}</div>
<div class="chk">2. Patient sample (EDTA tube) ${f.sample=='accepted'?'<span class="ok">Accepted</span>':f.sample=='rejected'?'<span class="no">Rejected, name mismatch</span>':`<button class="btn s" onclick="sample(${r.id},1)">Name matches, accept</button><button class="btn s" onclick="sample(${r.id},0)">Name does not match</button>`}</div>
<div class="chk">3. Patient typing ${f.typ&&f.typ.rev?'<span class="ok">Confirmed '+f.typ.v+'</span>':'<span class="mute">Lab: record and review</span>'}</div>
<div class="chk">4. Crossmatch ${f.xm&&f.xm.rev?`<span class="${f.xm.v=='Compatible'?'ok':'no'}">${f.xm.v}, reviewed</span>`:'<span class="mute">Lab: record and review</span>'}</div>
<div class="chk">5. Issue ${o.u.every(c=>unit(c).s=='Issued'||unit(c).s=='InTransit')?'<span class="ok">Issued</span>':`<button class="btn" onclick="issue(${r.id})">Issue units</button>`}${f.issued&&!f.dispatched?` <input id="rc${r.id}" placeholder="Receiver name, ID checked" style="width:210px;display:inline-block"><button class="btn k" onclick="disp(${r.id})">Dispatch and record handover</button>`:''}${f.dispatched?' <span class="ok">Dispatched, in transit</span>':''}</div></div>`}).join(''):'<div class="card">No approved offers from this center yet. Approve an offer as the treating doctor first.</div>'}
function paper(id){req(id).f.paper=1;ok('Signed paper request verified','paper.verify',req(id).ref)}
function sample(id,a){const r=req(id);r.f.sample=a?'accepted':'rejected';if(a)aud('identity.view',r.ref+' patient identity opened');ok(a?'Sample accepted':'Sample rejected. Crossmatch cannot start','sample.'+(a?'accept':'reject'),r.ref)}
function issue(id){const r=req(id),f=r.f,us=fq(r).u.map(unit);if(!f.paper)return deny('Signed request form is required','unit.issue');if(f.sample!='accepted')return deny('Patient sample is not accepted','unit.issue');if(!(f.xm&&f.xm.rev&&f.xm.v=='Compatible'))return deny('Crossmatch is required','unit.issue');if(us.some(u=>u.d<=0))return deny('Unit has expired','unit.issue');
 dlg(`<h3 style="margin:0 0 8px">Issue ${us.length} unit${us.length>1?'s':''}?</h3><p class="mute">${us.map(u=>u.code).join(', ')}. The receipt form will list unit numbers, crossmatch result and case data.</p>`,()=>{us.forEach(u=>u.s='Issued');f.issued=1;ok('Units issued. Receipt form generated','unit.issue',r.ref)})}
function disp(id){const r=req(id),n=V('rc'+id).trim();if(!n)return deny('Receiver name is required','unit.dispatch');fq(r).u.forEach(c=>unit(c).s='InTransit');r.f.dispatched=1;r.st='InFulfilment';ok('Dispatched. Handover recorded','unit.dispatch',r.ref+' to '+n)}

/* Laboratory */
function lRes(){const L=S.units.filter(u=>u.s=='Quarantined'||u.s=='Blocked');return L.map(u=>`<div class="card"><div class="row"><h3>${u.code} ${COMP[u.k]}</h3><b class="${u.s=='Blocked'?'no':''}">${u.s}</b></div>
${u.res?`<p style="margin:0">ABO/Rh ${bg(u.res.abo)} ${INF.map(([k,l])=>`${l}: <b class="${u.res[k]=='Negative'?'':'no'}">${u.res[k]}</b>`).join(', ')}</p><p class="mute" style="margin:2px 0 6px">Entered by ${u.by}. ${u.rev?'Reviewed by '+u.rev+'.':'Not reviewed yet.'}</p>${u.rev||u.s=='Blocked'?'':`<button class="btn k" onclick="rev('${u.code}')">Technical review as ${me()}</button>`}`:
`<div class="g"><label>Blood group${sel('r-'+u.code+'-abo',GR,'','Select')}</label>${INF.map(([k,l])=>`<label>${l}${sel('r-'+u.code+'-'+k,['Negative','Reactive','Invalid','Inconclusive'],'','Select')}</label>`).join('')}</div><p style="margin:8px 0 0"><button class="btn" onclick="save('${u.code}')">Save and mark complete</button></p>`}</div>`).join('')||'<div class="card">No units in quarantine.</div>'}
function save(c){const u=unit(c),r={abo:V(`r-${c}-abo`)},miss=[];if(!r.abo)miss.push('Blood group');INF.forEach(([k,l])=>{r[k]=V(`r-${c}-${k}`);if(!r[k])miss.push(l)});if(miss.length)return deny('Missing results: '+miss.join(', '),'result.complete');
 u.res=r;u.by=me();u.rev='';u.g=r.abo;const bad=INF.filter(([k])=>r[k]!='Negative');if(bad.length){u.s='Blocked';aud('unit.blocked',c+': non-negative result entered')}ok(bad.length?'Result entered. The unit is Blocked':'Results saved, waiting for a different technician to review','result.enter',c)}
function rev(c){const u=unit(c);if(u.by==me())return deny('A different person must review the results','result.review');u.rev=me();ok('Results reviewed','result.review',c)}
function lXm(){const L=S.reqs.filter(r=>fq(r)&&r.f.sample=='accepted'&&!['Cancelled','Completed'].includes(r.st));return L.length?L.map(r=>{const f=r.f,t=f.typ,x=f.xm,step=(k,lab,opts)=>{const s=f[k];return `<div class="chk"><b>${lab}</b> ${s?`${s.v}, recorded by ${s.by}. ${s.rev?'Reviewed by '+s.rev+'.':`<button class="btn k" onclick="rv(${r.id},'${k}')">Review as ${me()}</button>`}`:`${sel(k+r.id,opts,'','Select')}<button class="btn" onclick="rec(${r.id},'${k}')">Record as ${me()}</button>`}</div>`};
 return `<div class="card"><h3>${r.ref}, ${r.q} unit${r.q>1?'s':''} ${bg(r.g)}</h3>${step('typ','Patient blood group typing',GR)}${t&&t.rev?step('xm','Crossmatch',['Compatible','Incompatible']):'<p class="mute">Crossmatch opens after the typing is reviewed.</p>'}</div>`}).join(''):'<div class="card">No accepted patient samples waiting. The manager accepts the sample on the Fulfilment screen.</div>'}
function rec(id,k){const v=V(k+id);if(!v)return deny('Select a result','result.enter');req(id).f[k]={v,by:me(),rev:''};ok('Recorded. A different person must review it','crossmatch.record',req(id).ref+' '+k+' '+v)}
function rv(id,k){const r=req(id),s=r.f[k];if(s.by==me())return deny('A different person must review','crossmatch.review');s.rev=me();
 if(k=='xm'&&s.v=='Incompatible'){fq(r).u.forEach(c=>unit(c).s='Released');fq(r).st='failed';r.st='Open';r.f={};ok('Incompatible. Units return to Released and the quantity goes back to routing','crossmatch.review',r.ref);return}ok('Reviewed','crossmatch.review',r.ref+' '+k)}

/* Reception nurse and center physician */
function nIn(){const c=S.chk;return `<div class="card"><h3>Register donor and pre-donation check</h3><div class="g"><label>National ID<i>synthetic, governorate code 00</i><input id="n-i" maxlength="14" inputmode="numeric" placeholder="29801010012345"></label><label>Phone<input id="n-p" placeholder="01012345678"></label><label>Sex${sel('n-s',['M','F'],'M')}</label><label>Age<input id="n-a" type="number" value="25"></label><label>Weight<i>kg</i><input id="n-w" type="number" value="70"></label><label>Haemoglobin<i>g/dL</i><input id="n-h" type="number" step="0.1" value="14.0"></label><label>Days since last donation<input id="n-g" type="number" value="180"></label><label>Surgery in the last 12 months${sel('n-u',['No','Yes'],'No')}</label></div>
<div class="chk"><input type="checkbox" id="n-c1" style="width:auto;min-height:0"> Donation consent signed</div><div class="chk"><input type="checkbox" id="n-c2" style="width:auto;min-height:0"> Testing and notification consent signed</div>
<p style="margin:6px 0 0"><button class="btn" onclick="chk()">Run rule check</button></p></div>${c?`<div class="card"><h3>Rule results, policy version ${S.pv}</h3>${rtab(rules(c))}<p class="mute" style="margin:6px 0">Blood glucose and surgery history are recorded for the physician. No pass or fail is shown for them.</p><button class="btn k" onclick="sendV()">Send to the center physician</button></div>`:''}`}
function chk(){const id=V('n-i').trim(),ph=V('n-p').trim();if(!/^\d{14}$/.test(id))return deny('National ID must be 14 digits','donor.register');if(id.slice(7,9)!='00')return deny('Demo mode accepts synthetic IDs only (governorate code 00)','donor.register');if(!/^01[0125]\d{8}$/.test(ph))return deny('Wrong phone format','donor.register');
 if(!$('#n-c1').checked||!$('#n-c2').checked)return deny('Both consents must be signed before the check','consent.missing');const hb=+V('n-h');if(!(hb>=5&&hb<=25))return deny('Hemoglobin must be between 5 and 25 g/dL','donor.check');
 S.chk={idm:'•••• '+id.slice(-4),sex:V('n-s'),age:+V('n-a'),w:+V('n-w'),hb,gap:+V('n-g')};aud('donor.check','policy v'+S.pv+', ID not logged');render()}
function sendV(){S.visits.push({id:'V-'+S.vn++,...S.chk,st:'Awaiting physician'});S.chk=null;ok('Sent to the center physician','visit.submit')}
function nCol(){const L=S.visits.filter(v=>v.st=='Accepted');return L.length?L.map(v=>`<div class="card row"><div><b>${v.id}</b> donor ${v.idm}<br><small class="mute">Accepted by the physician</small></div><button class="btn" onclick="col('${v.id}')">Record collection</button></div>`).join(''):'<div class="card">No accepted donors waiting. The center physician accepts donors on the Donor decisions screen.</div>'}
function col(id){const v=S.visits.find(x=>x.id==id),c='BN-0'+S.un++;v.st='Collected';S.units.push({code:c,k:'prbc',g:'?',d:35,s:'Quarantined',res:null,by:'',rev:''});ok(`Collection recorded. Unit ${c} created as Quarantined. Label has no personal data`,'unit.create',c)}
function cDon(){const L=S.visits.filter(v=>v.st=='Awaiting physician');return L.length?L.map(v=>{const R=rules(v);return `<div class="card"><div class="row"><h3>${v.id}, donor ${v.idm}</h3><span class="mute">${v.sex=='M'?'Male':'Female'}, ${v.age} y, ${v.w} kg, Hb ${v.hb}, ${v.gap} days since last</span></div>${rtab(R)}<button class="btn k" onclick="dec('${v.id}',1)">Accept donor</button> ${sel('dr'+v.id,['Low haemoglobin','Recent illness','Medication','Other medical reason'],'','Defer reason')}<button class="btn s" onclick="dec('${v.id}',0)">Defer donor</button></div>`}).join(''):'<div class="card">No donors waiting for a decision.</div>'}
function dec(id,a){const v=S.visits.find(x=>x.id==id);if(a){if(rules(v).some(r=>!r[1]))return deny('A failed rule cannot be overridden','donor.accept');v.st='Accepted';ok('Donor accepted','donor.accept',id)}else{if(!V('dr'+id))return deny('A medical reason is required','donor.defer');v.st='Deferred';ok('Donor deferred. The shared registry shows only the deferral date, not the reason','donor.defer',id)}}
const gates=u=>{const r=u.res,R=[];if(!r)return[['Results entered',0,'Results are not entered']];R.push(['Four infection tests negative',INF.every(([k])=>r[k]=='Negative'),'Unit is blocked']);R.push(['Reviewed by someone else',!!u.rev&&u.rev!=u.by,'Results are not fully reviewed']);R.push(['Blood group confirmed by independent review',!!u.rev&&u.rev!=u.by,'Blood group is not confirmed']);R.push(['Approver did not enter results',u.by!=me(),'The approver cannot be the person who entered results']);R.push(['Not expired',u.d>0,'Unit has expired']);R.push(['Center holds a valid collect license until 2027-06-30',1,'Center is not licensed for collection']);return R};
function cRel(){const L=S.units.filter(u=>u.s=='Quarantined');return L.length?L.map(u=>`<div class="card"><div class="row"><h3>${u.code} ${COMP[u.k]}</h3>${u.res?bg(u.g):''}</div>${gates(u).map(g=>`<div class="chk"><span class="${g[1]?'ok':'no'}">${g[1]?'Met':'Not met'}</span> ${g[0]}</div>`).join('')}<button class="btn" onclick="rel('${u.code}')">Approve and release</button></div>`).join(''):'<div class="card">No units in quarantine.</div>'}
function rel(c){const u=unit(c),f=gates(u).find(g=>!g[1]);if(f)return deny(f[2],'unit.release');dlg(`<h3 style="margin:0 0 8px">Approve results and release ${c}?</h3><p class="mute">${bg(u.g)} ${COMP[u.k]}. Approval, release decision and policy version ${S.pv} are saved together. A label code is generated.</p>`,()=>{u.s='Released';ok('Unit released. Label code LBL-'+c.slice(3),'unit.release',c+' policy v'+S.pv)})}

/* Administration */
function fAcc(){return `<div class="card"><h3>Create a staff account</h3><div class="g"><label>Full name<input id="a-n"></label><label>Role${sel('a-r',['lab_tech','center_physician','treating_doctor','reception_nurse','blood_bank_manager'],'lab_tech')}</label><label>Professional license no.<i>required for physicians and doctors</i><input id="a-l"></label><label>Institution${sel('a-i',[HOSP,'Alexandria University Hospital'],HOSP)}</label></div><p style="margin:8px 0 0"><button class="btn" onclick="mkAcc()">Create account</button></p></div><div class="card sc"><table><tr><th>Name</th><th>Role</th><th>Status</th><th></th></tr>${S.acc.map((a,i)=>`<tr><td>${a.n}</td><td>${a.r}</td><td>${a.st}</td><td>${a.st=='pending_verification'?`<button class="btn k" onclick="vf(${i})">Confirm license ${a.lic}</button>`:''}</td></tr>`).join('')}</table></div>`}
function mkAcc(){const n=V('a-n').trim(),r=V('a-r'),l=V('a-l').trim();if(V('a-i')!=HOSP)return deny('You can only manage your own institution','account.create');if(!n)return deny('Name is required','account.create');if(/physician|doctor/.test(r)&&!l)return deny('Professional license number is required','account.create');S.acc.push({n,r,lic:l,st:r=='treating_doctor'?'pending_verification':'active'});ok(r=='treating_doctor'?'Account created. The doctor cannot submit blood requests until verified':'Account created','account.create',n+' '+r)}
function vf(i){S.acc[i].st='active';ok('License confirmed. Account is active','account.verify',S.acc[i].n)}
const PM={minAge:['Minimum donor age','Medical',18],hold:['Offer hold time (minutes)','Operational',0],maxEta:['Advisory transport time (minutes)','Operational',0]};
function sPol(){return `<div class="card"><h3>Active policy, version ${S.pv}</h3><table>${Object.entries(PM).map(([k,v])=>`<tr><td>${v[0]}</td><td>${v[1]}</td><td><b>${P[k]}</b></td><td class="mute">${v[2]?'National minimum '+v[2]:''}</td></tr>`).join('')}</table></div>
<div class="card"><h3>Propose a change</h3><div class="g"><label>Parameter${sel('p-k',Object.keys(PM).map(k=>PM[k][0]),'')}</label><label>New value<input id="p-v" type="number"></label></div><p style="margin:8px 0 0"><button class="btn" onclick="draft()">Save draft as ${me()}</button></p></div>
${S.drafts.filter(d=>d.st!='Active').map((d,i)=>`<div class="card"><b>${PM[d.k][0]}: ${P[d.k]} to ${d.v}</b>, drafted by ${d.by}. Status: <b>${d.st}</b><br>${d.st=='Draft'?`<button class="btn k" onclick="apv('${d.id}')">Approve as ${me()}</button>`:`<div class="g" style="margin-top:6px"><label>Clinical sign-off name<input id="so-n${d.id}"></label><label>Reference<input id="so-r${d.id}"></label></div><button class="btn" onclick="sign('${d.id}')">Record sign-off</button>`}</div>`).join('')}`}
function draft(){const k=Object.keys(PM).find(x=>PM[x][0]==V('p-k')),v=+V('p-v');if(!k||!(v>0))return deny('Select a parameter and a value','policy.draft');if(k=='minAge'&&v<18)return deny('Minimum age cannot be lower than 18 (national minimum)','policy.draft');S.drafts.push({id:'D'+(S.drafts.length+1),k,v,by:me(),st:'Draft'});ok('Draft saved','policy.draft',PM[k][0]+' '+v)}
function act(d){P[d.k]=d.v;S.pv++;d.st='Active';ok('Version '+S.pv+' is now active','policy.activate',PM[d.k][0]+' = '+d.v)}
function apv(id){const d=S.drafts.find(x=>x.id==id);if(d.by==me())return deny('A different admin must approve this change','policy.approve');d.ap=me();if(PM[d.k][1]=='Medical'){d.st='Pending clinical sign-off';ok('Approved. Waiting for clinical sign-off','policy.approve',id)}else act(d)}
function sign(id){const d=S.drafts.find(x=>x.id==id);if(!V('so-n'+id).trim()||!V('so-r'+id).trim())return deny('Sign-off name and reference are required','policy.signoff');aud('policy.signoff',id);act(d)}
function sBot(){return `<div class="card"><h3>Submit an answer for review</h3><div class="row" style="justify-content:flex-start"><input id="k-q" placeholder="Question or topic" style="width:320px"><button class="btn" onclick="addKb()">Submit as ${me()}</button></div></div>`+S.kb.map(k=>`<div class="card row" style="align-items:center"><div><b>${esc(k.q)}</b><br><small class="mute">Author ${k.by}. Status: <b>${k.st}</b>${k.why?'. Reason: '+esc(k.why):''}</small></div>${k.st=='In review'?`<div><button class="btn k" onclick="kb(${k.id},1)">Approve</button> <input id="kr${k.id}" placeholder="Rejection reason" style="width:170px;display:inline-block"><button class="btn s" onclick="kb(${k.id},0)">Reject</button></div>`:''}</div>`).join('')+'<p class="mute">Donors only ever see Published answers.</p>'}
function addKb(){const q=V('k-q').trim();if(!q)return deny('Enter a question');S.kb.push({id:S.kb.length+1,q,st:'In review',by:me()});ok('Submitted for review','content.submit',q)}
function kb(id,a){const k=S.kb.find(x=>x.id==id);if(a){if(k.by==me())return deny('Another admin must approve this answer','content.approve');k.st='Published';ok('Answer published','content.approve',k.q)}else{const w=V('kr'+id).trim();if(!w)return deny('Reason is required','content.reject');k.st='Rejected';k.why=w;ok('Answer rejected','content.reject',k.q)}}
function sAud(){return `<div class="card sc"><p class="mute" style="margin-top:0">Entries cannot be edited or deleted. Denied attempts are logged too.</p><table><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th><th>Outcome</th></tr>${S.audit.map(a=>`<tr><td>${a.t}</td><td>${a.u}<br><small class="mute">${a.r}</small></td><td>${a.a}</td><td>${esc(a.d)}</td><td class="${a.ok?'ok':'no'}">${a.ok?'Done':'Denied'}</td></tr>`).join('')||'<tr><td colspan="5" class="mute">Actions from every role appear here.</td></tr>'}</table></div>`}
const SCR={'d-new':dNew,'d-req':dReq,'m-in':mIn,'m-stk':mStk,'m-ful':mFul,'l-res':lRes,'l-xm':lXm,'n-in':nIn,'n-col':nCol,'c-don':cDon,'c-rel':cRel,'f-acc':fAcc,'s-pol':sPol,'s-bot':sBot,'s-aud':sAud};
render();
</script>
</body>
</html>
