<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>BloodNet — Blood Coordination Network (Demonstration)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f4f6f9;--card:#fff;--ink:#14202e;--mute:#58677a;--line:#d6dde6;--navy:#0f2b46;--navy2:#1b4468;--red:#b01f2d;--ok:#17714a;--warn:#9a5b00;--soft:#e8edf3;--focus:#0a58ca;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.55 "IBM Plex Sans",Arial,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 370px;min-height:100vh}
@media(max-width:1100px){.app{grid-template-columns:1fr}}
aside{background:var(--navy);color:#dbe6f1;padding:16px 12px}
aside h1{font-size:20px;margin:0 6px;color:#fff;letter-spacing:.2px}aside .sub{margin:0 6px 14px;font-size:12px;color:#9fb6cc}
.rl{display:block;width:100%;text-align:left;background:none;border:0;color:#dbe6f1;padding:8px 10px;border-radius:6px;margin:2px 0}
.rl.on{background:var(--navy2);color:#fff;font-weight:600}.rl small{display:block;color:#9fb6cc;font-weight:400}
.who{margin:16px 6px 0;padding-top:12px;border-top:1px solid #2b4e6f;font-size:12.5px;color:#9fb6cc}.who b{color:#fff;display:block;font-size:14px}
.demo{margin:14px 6px 0;font-size:12px;background:#17375a;border-radius:6px;padding:8px 10px;color:#cfe0f0}
main{padding:18px 22px;min-width:0}
h2{margin:0 0 2px;font-size:21px}.lead{margin:0 0 14px;color:var(--mute)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 16px;color:var(--mute);font-weight:500}.tabs .on{color:var(--ink);border-color:var(--red);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:15.5px}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mute{color:var(--mute)}.err{color:var(--red);min-height:1.4em;margin:8px 0 0;font-weight:500}.ok{color:var(--ok);font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 14px}
label{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:13px}
label i{font-weight:400;font-style:normal;color:var(--mute)}
input,select{border:1px solid #9fb0c2;border-radius:5px;padding:9px 10px;background:#fff;color:var(--ink);font:inherit;width:100%;min-height:42px}
.btn{background:var(--red);color:#fff;border:0;border-radius:5px;padding:9px 18px;font-weight:600;min-height:42px}
.btn.s{background:#fff;color:var(--navy);border:1px solid #9fb0c2}.btn.g2{background:var(--ok)}
.btn[disabled]{opacity:.45;cursor:default}
.pill{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:0 10px;font-size:12px;font-weight:600}
.p-Urgent{color:var(--warn)}.p-Emergency{color:var(--red)}.p-Routine{color:var(--mute)}
.bg{display:inline-block;min-width:2.8em;text-align:center;background:var(--red);color:#fff;border-radius:4px;padding:0 7px;font-weight:700}
.tl{display:flex;margin:10px 0 4px}.tl div{flex:1;font-size:12px;color:var(--mute);border-top:4px solid var(--line);padding-top:4px}.tl .d{border-color:var(--ok);color:var(--ink);font-weight:600}
.offer{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:10px 0}
.sum{display:flex;gap:30px;flex-wrap:wrap}.sum b{font-size:26px;display:block;line-height:1.1}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mute);font-weight:600;background:var(--soft)}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.life{height:8px;width:110px;border-radius:4px;background:var(--soft);overflow:hidden}.life i{display:block;height:100%;background:var(--ok)}.life.w i{background:var(--warn)}.life.d i{background:var(--red)}
.map{width:100%;height:auto;display:block}.cen{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;cursor:pointer}.cen.sel{border:2px solid var(--red)}
.right{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
@media(max-width:1100px){.right{height:auto;min-height:480px;position:static;border-left:0;border-top:1px solid var(--line)}}
.rt{display:flex;border-bottom:1px solid var(--line)}.rt button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:11px;font-weight:600;color:var(--mute)}.rt .on{color:var(--ink);border-color:var(--red)}
#msgs,#log{flex:1;overflow-y:auto;padding:10px 12px;min-height:0}
.m{max-width:92%;padding:8px 12px;border-radius:10px;margin:6px 0;white-space:pre-line}.m.b{background:var(--soft)}.m.u{background:var(--navy);color:#fff;margin-left:auto}
.ac{border:2px dashed var(--red);border-radius:8px;padding:8px 10px;margin-top:8px;background:#fff;color:var(--ink);white-space:normal}.ac .btn{margin-top:6px}
#sug{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px}#sug button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:3px 12px;font-size:13px}
#cf{display:flex;gap:6px;padding:8px 12px 12px;border-top:1px solid var(--line)}
.lg{font:12px/1.5 "IBM Plex Mono",monospace;border-bottom:1px solid var(--soft);padding:5px 0}.lg .c2{color:var(--ok)}.lg .c4{color:var(--red);font-weight:500}
#dlg{position:fixed;inset:0;background:rgba(15,43,70,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}#dlg[hidden]{display:none}
#dlg div.b{background:#fff;border-radius:10px;padding:20px;max-width:460px;width:100%}
.big{font-size:20px;font-weight:600;line-height:1.5}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;margin:auto;width:max-content;max-width:90%;background:var(--navy);color:#fff;padding:9px 20px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}#toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
<aside><h1>BloodNet</h1><p class="sub">Blood Coordination Network</p><nav id="roles" aria-label="Role"></nav><div class="who" id="who"></div>
<div class="demo">Demonstration with simulated data. No real patients, donors or units. No server connection.</div></aside>
<main id="main"></main>
<section class="right"><div class="rt"><button id="t-bot" onclick="tab('bot')">Assistant</button><button id="t-log" onclick="tab('log')">System log</button></div>
<div id="msgs" aria-live="polite"></div><div id="sug"></div>
<form id="cf" onsubmit="ask($('#cin').value);return false"><input id="cin" autocomplete="off" aria-label="Message" placeholder="Type a message"><button class="btn">Send</button></form>
<div id="log" hidden></div></section>
</div>
<div id="dlg" hidden role="dialog" aria-modal="true"><div class="b"><div id="dlgb"></div><p style="text-align:right;margin:16px 0 0"><button class="btn s" onclick="dlg()">Go back</button> <button class="btn" onclick="dlgOk()">Confirm</button></p></div></div>
<div id="toast" role="status"></div>
<script type="application/json" id="data">
{"centers":[
{"id":1,"n":"Regional Blood Bank, Damanhour","s":"Regional","km":3.2,"x":36,"y":20,"c":1,"h":"08:00 to 20:00"},
{"id":2,"n":"Kafr El-Dawwar Blood Bank","s":"Kafr El-Dawwar","km":24,"x":74,"y":16,"c":1,"h":"09:00 to 17:00"},
{"id":3,"n":"Alexandria Central Blood Bank","s":"Alexandria","km":62,"x":84,"y":52,"c":1,"h":"24 hours"},
{"id":4,"n":"Collection unit (collection licence suspended)","s":"Suspended","km":5,"x":18,"y":42,"c":0,"h":"-"},
{"id":5,"n":"Damanhour University Donation Centre","s":"University","km":1.5,"x":60,"y":44,"c":1,"h":"10:00 to 16:00"}],
"eta":{"1":"20 min","2":"35 min","3":"75 min"},
"remote":{"2":{"prbc:O-":[3,9],"prbc:A+":[8,12],"plt:A+":[2,3]},"3":{"prbc:O-":[6,14],"prbc:O+":[10,20],"prbc:B+":[5,18],"ffp:A+":[4,60]}},
"units":[["BN-0412","prbc","A+",3,"x"],["BN-0413","prbc","A+",3,"r"],["BN-0418","prbc","A+",21,"x"],["BN-0425","prbc","A+",28,"x"],["BN-0431","prbc","A+",35,"r"],["BN-0440","prbc","A+",40,"q"],["BN-0450","prbc","O-",4,"r"],["BN-0455","prbc","O-",26,"r"],["BN-0460","prbc","O-",30,"r"],["BN-0470","plt","A+",2,"r"],["BN-0480","ffp","B+",120,"r"],["BN-0490","prbc","B+",33,"r"],["BN-0500","prbc","O-",35,"q"],["BN-0501","prbc","A+",35,"q"]],
"reqs":[
{"id":1042,"own":1,"k":"prbc","g":"O-","q":2,"pr":"Urgent","p":1,"to":[2,3],"offers":[{"c":2,"qty":2,"days":9,"st":"new"},{"c":3,"qty":2,"days":14,"st":"new"}]},
{"id":1038,"own":0,"k":"prbc","g":"A+","q":3,"pr":"Routine","p":0,"to":[1],"offers":[]},
{"id":1040,"own":0,"k":"prbc","g":"O-","q":1,"pr":"Urgent","p":0,"to":[1],"offers":[]}],
"kb":[
{"q":"How do I donate blood?","p":"how.*(donate|give)|steps|process|procedure","a":"Donation has four steps: registration with proof of identity, a brief screening that includes blood pressure and haemoglobin, the collection itself, and a short rest with fluids.","r":"2026-09-15"},
{"q":"What should I do before donating?","p":"before|prepare","a":"Have a light meal, drink fluids, and try to sleep well the night before.","r":"2026-09-15"},
{"q":"What should I do after donating?","p":"after|recover","a":"Rest at the centre for a few minutes, drink fluids, and avoid strenuous exercise for the rest of the day.","r":"2026-09-15"},
{"q":"How often can I donate?","p":"how often|interval|between|again|months","a":"The interval between donations is set by the centre guideline and counted in months. The medical team confirms it at screening.","r":"2026-09-15"},
{"q":"What documents do I need?","p":"document|\\bid\\b|bring|identification","a":"Bring valid proof of identity, such as a national ID card, for registration.","r":"2026-09-15"}],
"hi":{"phys":"Write your request in one sentence, for example: 2 units O negative urgent. I will prepare the request form. You can also ask about the status of a request or its offers.","mgr":"I can summarise new requests, stock of a blood group, and units close to expiry.","lab":"I can answer general donation questions from approved content.","don":"I answer only from approved content and can point you to the nearest centre. Medical questions are referred to a physician."},
"sug":{"phys":["2 units O negative urgent","Status of request 1042?","Who replied?","Approve the nearest offer"],"mgr":["What are the new requests?","Stock of A positive","What is close to expiry?","Show the patient name"],"lab":["How often can I donate?"],"don":["How do I donate?","Nearest donation centre","Can I donate if I take medication?","I feel faint after donating and cannot stand","My ID 12345678901234 how do I donate?"]}}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),$=s=>document.querySelector(s);
const COMP={prbc:'Packed Red Blood Cells (PRBC)',plt:'Platelet Concentrate',ffp:'Fresh Frozen Plasma (FFP)',cryo:'Cryoprecipitate'},PRI=['Routine','Urgent','Emergency'],GR=['A+','A-','B+','B-','AB+','AB-','O+','O-'];
const NM={'+':'Rh-positive','-':'Rh-negative'},gname=g=>g.slice(0,-1)+' '+NM[g.slice(-1)];
const CMP={'O-':['O-'],'O+':['O-','O+'],'A-':['A-','O-'],'A+':['A+','A-','O+','O-'],'B-':['B-','O-'],'B+':['B+','B-','O+','O-'],'AB-':['AB-','A-','B-','O-'],'AB+':GR};
const STEPS=['Submitted','Offer received','Offer approved','Crossmatched','Issued'];
const bg=g=>`<b class="bg" dir="ltr" title="${gname(g)}">${g.replace('-','−')}</b>`,dt=d=>new Date(Date.now()+d*864e5).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),cn=id=>D.centers.find(c=>c.id==id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROLES={phys:['Treating Physician','Damanhour University Hospital','Dr. Mona El-Sayed',[['p-new','New request'],['p-req','My requests']]],mgr:['Blood Bank Manager','Regional Blood Bank, Damanhour','Khaled Abdullah',[['m-in','Requests'],['m-inv','Inventory']]],lab:['Laboratory Technologist','Regional Blood Bank, Damanhour','Sara Hassan',[['l-q','Donor screening'],['l-x','Crossmatch']]],don:['Donor (public)','Public portal','Visitor',[['d-find','Find a centre']]]};
const S={role:'phys',scr:'p-new',tb:'bot',reqs:structuredClone(D.reqs),units:D.units.map(u=>({code:u[0],k:u[1],g:u[2],d:u[3],s:u[4]})),log:[],next:1043,pre:null,slots:{},sel:1,pay:null,
 chats:Object.fromEntries(Object.keys(D.hi).map(k=>[k,[{h:D.hi[k]}]]))};
const api=(m,p,s,ch,e)=>{S.log.unshift({t:new Date().toLocaleTimeString('en-GB'),r:ROLES[S.role][0],m,p,s,ch:ch||'web',e:e||''});if(S.tb=='log')renderLog()};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2800)}
function dlg(h,f){if(!h){$('#dlg').hidden=true;return}$('#dlgb').innerHTML=h;S.pay=f;$('#dlg').hidden=false}
function dlgOk(){const f=S.pay;$('#dlg').hidden=true;if(f)f()}
function setRole(r){S.role=r;S.scr=ROLES[r][3][0][0];render();renderChat()}
function go(s){S.scr=s;render()}
function tab(t){S.tb=t;$('#t-bot').className=t=='bot'?'on':'';$('#t-log').className=t=='log'?'on':'';['#msgs','#sug','#cf'].forEach(s=>$(s).hidden=t!='bot');$('#log').hidden=t!='log';if(t=='log')renderLog()}
function renderLog(){$('#log').innerHTML=S.log.length?S.log.map(l=>`<div class="lg">${l.t} ${l.r}<br>${l.m} ${l.p} [${l.ch}] <span class="${l.s<400?'c2':'c4'}">${l.s} ${l.e}</span></div>`).join(''):'<p class="mute">API calls from the screens and from the assistant appear here.</p>'}
function render(){const R=ROLES[S.role];
 $('#roles').innerHTML=Object.entries(ROLES).map(([k,v])=>`<button class="rl${k==S.role?' on':''}" onclick="setRole('${k}')">${v[0]}<small>${v[1]}</small></button>`).join('');
 $('#who').innerHTML=`<b>${R[2]}</b>${R[0]}`;
 $('#main').innerHTML=`<div class="tabs">${R[3].map(([k,l])=>`<button class="${k==S.scr?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div>`+SCR[S.scr]()}
const sel=(id,o,v,ph)=>`<select id="${id}">${ph?`<option value="">${ph}</option>`:''}${o.map(([k,l])=>`<option value="${k}"${k==v?' selected':''}>${l}</option>`).join('')}</select>`;
const mine=()=>S.reqs.filter(r=>r.own);
const line=r=>`${r.q} unit${r.q>1?'s':''} ${bg(r.g)} ${COMP[r.k]}`;
const head=r=>`<div class="row"><h3>Request ${r.id}</h3><span class="pill p-${r.pr}">${r.pr}</span></div><p style="margin:0">${line(r)}</p>`;
const tl=r=>`<div class="tl">${STEPS.map((s,i)=>`<div class="${i<=r.p?'d':''}">${s}</div>`).join('')}</div>`;
const pool=r=>S.units.filter(u=>u.k==r.k&&u.s=='r'&&(r.k=='prbc'?CMP[r.g]:[r.g]).includes(u.g)).sort((a,b)=>(a.g==r.g?0:1)-(b.g==r.g?0:1)||a.d-b.d);
function fNew(){const p=S.pre||{};S.pre=null;
 return `${p.g?'<div class="card" style="border-color:var(--ok)">Component, blood group, quantity and priority were pre-filled by the assistant as defaults. Review them, enter the patient details, and submit.</div>':''}
<div class="card"><h3>New transfusion request</h3><p class="mute" style="margin-top:0">Patient details are used for this request only and are not shown to the assistant.</p><div class="g">
<label>Blood component${sel('f-k',Object.entries(COMP),p.k||'prbc')}</label>
<label>Recipient ABO / Rh group${sel('f-g',GR.map(g=>[g,gname(g)]),p.g||'','Select group')}</label>
<label>Quantity <i>units</i><input id="f-q" type="number" min="1" value="${p.q||''}"></label>
<label>Priority${sel('f-p',PRI.map(x=>[x,x]),p.pr||'','Select priority')}</label>
<label>Clinical indication${sel('f-c',['Acute haemorrhage','Peri-operative','Anaemia','Thrombocytopenia','Coagulopathy'].map(x=>[x,x]),'','Select indication')}</label>
<label>Haemoglobin <i>g/dL, optional</i><input id="f-h" type="number" step="0.1" min="0"></label>
<label>Patient full name<input id="f-n" autocomplete="off"></label>
<label>National ID <i>14 digits</i><input id="f-i" inputmode="numeric" maxlength="14" autocomplete="off"></label></div>
<p id="err" class="err"></p><button class="btn" onclick="verify()">Review request</button></div>`}
function verify(){const k=$('#f-k').value,g=$('#f-g').value,q=+$('#f-q').value,p=$('#f-p').value,c=$('#f-c').value,n=$('#f-n').value.trim(),i=$('#f-i').value.trim(),e=$('#err');
 const m=!g?'Select the blood group.':!(q>=1)?'Quantity must be 1 or more.':!p?'Select the priority.':!c?'Select the clinical indication.':!n?'Enter the patient name.':!/^\d{14}$/.test(i)?'National ID must be 14 digits.':'';
 if(m){e.textContent=m;return}
 dlg(`<h3 style="margin:0 0 8px">Verify before sending</h3><p class="big">${q} unit${q>1?'s':''} of ${COMP[k]}<br>${bg(g)} ${gname(g)}<br><span class="pill p-${p}">${p}</span></p><p class="mute">Patient: ${esc(n)}, ID ending ${i.slice(-4)}.<br>Indication: ${c}.</p>`,()=>submit({k,g,q,pr:p}))}
function submit(v){const r={id:S.next++,own:1,...v,p:0,to:[1,2,3],offers:[]};S.reqs.unshift(r);api('POST','/requests',201);go('p-req');toast('Request sent to nearby blood banks');
 [2,3].forEach((c,j)=>setTimeout(()=>{const s=D.remote[c][r.k+':'+r.g];if(s&&r.p<2){r.offers.push({c,qty:Math.min(r.q,s[0]),days:s[1],st:'new'});r.p=Math.max(r.p,1);if(S.scr=='p-req')render()}},1500*(j+1)))}
function fReq(){return mine().map(r=>`<div class="card">${head(r)}${tl(r)}${r.offers.map((o,i)=>`<div class="offer"><div><b>${cn(o.c).n}</b><br><small class="mute">${o.qty} unit${o.qty>1?'s':''}, ${cn(o.c).km} km, estimated arrival ${D.eta[o.c]} (estimate), unit expiry ${dt(o.days)}</small></div>${o.st=='ok'?'<span class="ok">Approved</span>':`<button class="btn" ${r.p>=2?'disabled':''} onclick="appr(${r.id},${i})">Approve offer</button>`}</div>`).join('')}${r.offers.length?'':'<p class="mute">No centre has replied yet. The request is still being routed.</p>'}${r.p==4?'<p class="ok">Units issued by the blood bank.</p>':''}</div>`).join('')}
function appr(id,i){const r=S.reqs.find(x=>x.id==id),o=r.offers[i];
 dlg(`<h3 style="margin:0 0 8px">Approve this offer?</h3><p class="big">${line(r)}</p><p class="mute">${cn(o.c).n}, ${o.qty} unit${o.qty>1?'s':''}, expiry ${dt(o.days)}.</p>`,()=>{o.st='ok';r.p=2;(o.u||[]).forEach(c=>{S.units.find(u=>u.code==c).s='x'});api('POST','/requests/'+id+'/offers/'+(i+1)+'/approve',200);toast('Offer approved');render()})}
const inb=()=>S.reqs.filter(r=>(r.to.includes(1)&&!r.offers.some(o=>o.c==1)&&r.p<2)||(r.p==3&&r.offers.some(o=>o.c==1&&o.st=='ok')));
function fIn(){const L=inb();return L.length?L.map(r=>{const iss=r.p==3;return `<div class="card">${head(r)}${tl(r)}<p class="mute">${iss?`Crossmatch complete. Patient identity is shown on the issue screen: ${esc(r.pn||'M.K.')}, ID ending ${r.pi||'4821'}.`:`Compatible units available here: ${pool(r).length}. Patient identity is not shown.`}</p><button class="btn ${iss?'g2':''}" onclick="${iss?`issue(${r.id})`:`offer(${r.id})`}">${iss?'Issue units':'Prepare offer (earliest expiry first)'}</button></div>`}).join(''):'<div class="card">No requests waiting for action.</div>'}
function offer(id){const r=S.reqs.find(x=>x.id==id),a=pool(r).slice(0,r.q);if(!a.length){toast('No compatible released units in stock');return}
 r.offers.push({c:1,qty:a.length,days:a[0].d,st:'new',u:a.map(u=>u.code)});r.p=Math.max(r.p,1);api('POST','/requests/'+id+'/offers',201);toast('Offer sent to the treating physician');render()}
function issue(id){const r=S.reqs.find(x=>x.id==id),o=r.offers.find(x=>x.c==1&&x.st=='ok');o.u.forEach(c=>{S.units.find(u=>u.code==c).s='i'});r.p=4;api('POST','/requests/'+id+'/issue',200);toast('Units issued');render()}
const ST={r:'Released',x:'Reserved',q:'Quarantine',i:'Issued',z:'Discarded'};
function fInv(){const c=s=>S.units.filter(u=>u.s==s).length,w=d=>d<=7?'d':d<=14?'w':'';
 return `<div class="card"><div class="sum"><div><b>${c('r')}</b>Released</div><div><b>${c('x')}</b>Reserved</div><div><b>${c('q')}</b>Quarantine, awaiting screening</div><div><b>${c('i')}</b>Issued</div></div></div>
<div class="card sc"><table><tr><th>Unit ID</th><th>Component</th><th>Group</th><th>Status</th><th>Shelf life remaining</th></tr>${[...S.units].filter(u=>u.s!='z').sort((a,b)=>a.d-b.d).map(u=>`<tr><td>${u.code}</td><td>${COMP[u.k]}</td><td>${bg(u.g)}</td><td>${ST[u.s]}</td><td><div class="life ${w(u.d)}"><i style="width:${Math.min(100,u.d/40*100)}%"></i></div><small class="mute">${u.d} days, expires ${dt(u.d)}</small></td></tr>`).join('')}</table></div>`}
function fLq(){const L=S.units.filter(u=>u.s=='q');return `<div class="card"><h3>Donor screening results</h3><p class="mute" style="margin-top:0">Record infectious disease screening per the national transfusion guideline. Units stay in quarantine until a result is recorded.</p></div>`+(L.length?L.map(u=>`<div class="card row" style="align-items:center"><div><b>${u.code}</b> ${bg(u.g)} ${COMP[u.k]}<br><small class="mute">Expires ${dt(u.d)}</small></div><div><button class="btn g2" onclick="scr('${u.code}',1)">Non-reactive, release</button> <button class="btn s" onclick="scr('${u.code}',0)">Reactive, discard</button></div></div>`).join(''):'<div class="card">No units in quarantine.</div>')}
function scr(c,ok){S.units.find(u=>u.code==c).s=ok?'r':'z';api('POST','/units/'+c+'/screening',200);toast(ok?'Unit released to stock':'Unit discarded and logged');render()}
function fLx(){const L=S.reqs.filter(r=>r.p==2&&r.offers.some(o=>o.c==1&&o.st=='ok'));return L.length?L.map(r=>{const u=r.offers.find(o=>o.c==1).u.map(c=>S.units.find(x=>x.code==c));return `<div class="card">${head(r)}<p class="mute">Recipient ${gname(r.g)}. Units: ${u.map(x=>x.code+' ('+x.g.replace('-','−')+')').join(', ')}.</p><button class="btn" onclick="xm(${r.id})">Run crossmatch</button></div>`}).join(''):'<div class="card">No units waiting for crossmatch. Approve an offer from this blood bank as the physician first.</div>'}
function xm(id){const r=S.reqs.find(x=>x.id==id);r.p=3;api('POST','/requests/'+id+'/crossmatch',200);toast('Crossmatch compatible (ABO/Rh)');render()}
function fFind(){const L=D.centers.filter(c=>c.c).sort((a,b)=>a.km-b.km);
 return `<div class="card"><svg class="map" viewBox="0 0 100 64" role="img" aria-label="Schematic map of donation centres"><rect width="100" height="64" rx="3" style="fill:var(--soft)"/><path d="M0 54 Q30 46 55 52 T100 42" style="fill:none;stroke:var(--line);stroke-width:2"/><circle cx="50" cy="32" r="2" style="fill:var(--ink)"/><text x="50" y="37.5" text-anchor="middle" font-size="3.2" style="fill:var(--ink)">You</text>${L.map(c=>`<g onclick="S.sel=${c.id};render()" style="cursor:pointer"><circle cx="${c.x}" cy="${c.y}" r="${c.id==S.sel?3.6:2.6}" style="fill:${c.id==S.sel?'var(--red)':'var(--navy)'}"/><text x="${c.x}" y="${c.y-4.5}" text-anchor="middle" font-size="3.2" style="fill:var(--ink)">${c.s}</text></g>`).join('')}</svg></div>
${L.map(c=>`<div class="card cen${c.id==S.sel?' sel':''}" onclick="S.sel=${c.id};render()"><b>${c.n}</b><span>${c.km} km</span><small class="mute">Hours: ${c.h}</small></div>`).join('')}<p class="mute">Only centres with an active collection licence are listed.</p>`}
const SCR={'p-new':fNew,'p-req':fReq,'m-in':fIn,'m-inv':fInv,'l-q':fLq,'l-x':fLx,'d-find':fFind};

/* Assistant: read-only, rule based, no LLM. Replies come from templates or approved content. */
const TITLE={phys:'Request assistant',mgr:'Blood bank assistant',lab:'General assistant',don:'Donor assistant'};
function renderChat(){const m=S.chats[S.role],b=$('#msgs');
 b.innerHTML=`<p class="mute" style="margin:0"><b>${TITLE[S.role]}</b>. Read-only: it never creates, approves or changes anything.</p>`+m.map((x,i)=>`<div class="m ${x.u?'u':'b'}">${x.h}${x.c?`<div class="ac">${x.c.l}<br><button class="btn" onclick="runCard(${i})">${x.c.b}</button></div>`:''}</div>`).join('');b.scrollTop=b.scrollHeight;
 $('#sug').innerHTML=D.sug[S.role].map(q=>`<button onclick="ask(this.textContent)">${q}</button>`).join('')}
function runCard(i){const c=S.chats[S.role][i].c;
 if(c.t=='open_screen'&&ROLES[S.role][3].some(t=>t[0]==c.v))go(c.v);
 else if(c.t=='open_request_form'&&S.role=='phys'){S.pre=c.v;go('p-new')}
}
const rx=(p,s)=>new RegExp(p).test(s),W={one:1,two:2,three:3,four:4,five:5,six:6,'وحدتين':2};
function ask(raw){raw=(raw||'').trim();if(!raw)return;
 let t=raw.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)),dig=/\d{11,14}/.test(t);t=t.replace(/\d{11,14}/g,' [removed] ');
 const ch=S.chats[S.role];ch.push({u:1,h:esc(t)});ch.push(answer(t.replace('[removed]',' ').toLowerCase(),dig));renderChat();$('#cin').value=''}
function answer(n,dig){const R=S.role,T=n.split(/[^a-z\u0600-\u06ff0-9+-]+/),has=(...a)=>a.some(x=>T.includes(x)),bot=p=>api('GET',p,200,'bot');
 const note=dig?'I removed digits that look like a national ID or phone number and I do not keep them. '+(R=='phys'?'Enter the patient on the request form.':'Please do not type personal numbers here.')+'\n':'';
 const out=(h,c)=>({h:note+h,c}),grp=()=>{const g=n.match(/(?:^|[^a-z])(ab|a|b|o)\s*(\+|-|pos\w*|neg\w*|موجب|سالب)/);return g&&g[1].toUpperCase()+(/^(\+|pos|موجب)/.test(g[2])?'+':'-')};
 if(rx('ignore|approve|submit|delete|remove|discard|release|issue|cancel|اعتمد',n)){
  const c=R=='phys'?(rx('approve|اعتمد',n)?{t:'open_screen',v:'p-req',l:'Offers are approved on the My requests screen.',b:'Open My requests'}:{t:'open_request_form',v:{},l:'Requests are submitted from the form.',b:'Open the request form'}):R=='mgr'?{t:'open_screen',v:'m-inv',l:'Units are changed on the Inventory screen.',b:'Open Inventory'}:null;
  api('POST',R=='phys'?'/requests/offers/approve':'/inventory/units/change',403,'bot','CHANNEL_NOT_ALLOWED');
  return out('I cannot do that. I am read-only: I do not create, approve, release or change any data. The system also rejects any write from my channel (403).',c)}
 if(R=='don'&&rx("faint|dizz|can.t stand|cannot stand|bleeding|short of breath|chest pain|unconscious|دوخ|اغم",n))return out('Medical emergency message: call the ambulance on 123 now. If you are at a centre or hospital, tell the staff immediately and do not move alone. I will not try to answer from the published content.');
 if(R=='phys'){
  const id=+(n.match(/\d{4}/)||[0])[0];
  if(id||has('status','replied','offers','offer','who','reply')){
   const r=id?S.reqs.find(x=>x.id==id):mine()[0];bot('/requests'+(id?'/'+id:''));if(!r||!r.own)return out('Request not found.');
   const c=r.offers.some(o=>o.st!='ok')&&r.p<2?{t:'open_screen',v:'p-req',l:'To approve an offer, open the offers screen.',b:'Open My requests'}:null;
   if(!has('replied','offers','offer','who','reply'))return out(`Request ${r.id}: ${STEPS[r.p]}.`,c);
   if(!r.offers.length)return out(`Nobody has replied to request ${r.id} yet. It is still being routed.`);
   return out(`Offers for request ${r.id}:\n`+r.offers.map(o=>`• ${cn(o.c).n}: ${o.qty} unit${o.qty>1?'s':''}, ${cn(o.c).km} km, arrival ${D.eta[o.c]} (estimate), unit expiry ${dt(o.days)}`).join('\n'),c)}
  const sl=S.slots,g=grp(),q=n.match(/(\d+)\s*(?:units?|bags?|وحد)/)||n.match(/(?:^|\s)(\d+)(?=\s|$)/),k=T.find(x=>W[x]);
  if(g)sl.g=g;if(q)sl.q=+q[1];else if(k)sl.q=W[k];
  if(rx('platelet|plt',n))sl.k='plt';else if(rx('plasma|ffp',n))sl.k='ffp';else if(rx('cryo',n))sl.k='cryo';else if(rx('red|prbc|rbc',n))sl.k='prbc';
  const p=rx('emergency|طوارئ',n)?'Emergency':rx('urgent|stat|مستعجل|عاجل',n)?'Urgent':rx('routine',n)?'Routine':null;if(p)sl.pr=p;
  if(!Object.keys(sl).length)return out('I can prepare a transfusion request form from one sentence, or follow up a request and its offers.');
  if(sl.q!=null&&!(sl.q>=1)){delete sl.q;return out('Quantity must be 1 or more.')}
  if(!sl.g)return out('Which blood group and Rh?');if(!sl.q)return out('How many units?');if(!sl.pr)return out('What is the priority: routine, urgent or emergency?');
  const v={k:sl.k||'prbc',g:sl.g,q:sl.q,pr:sl.pr};S.slots={};
  return out(`Summary: ${v.q} unit${v.q>1?'s':''}, ${bg(v.g)} ${gname(v.g)}, ${COMP[v.k]}, ${v.pr}.`,{t:'open_request_form',v,l:'This opens the form with these values. Nothing is sent until you enter the patient and confirm.',b:'Open request form with these values'})}
 if(R=='mgr'){
  if(rx('name|patient|identity|national id',n))return out('I never show patient or donor identity. Patient identity appears on the issue screen after the offer is approved and crossmatched.');
  if(rx('stock|inventory',n)){const g=grp();if(!g)return out('Stock of which blood group?');bot('/inventory');const u=S.units.filter(x=>x.k=='prbc'&&x.g==g),c=s=>u.filter(x=>x.s==s).length;
   return out(`PRBC ${bg(g)} at your centre only: ${c('r')} released, ${c('x')} reserved, ${c('q')} in quarantine.`,{t:'open_screen',v:'m-inv',l:'Details are on the Inventory screen.',b:'Open Inventory'})}
  if(rx('expir|close',n)){bot('/inventory/expired');const u=S.units.filter(x=>x.d<=7&&x.s!='z'&&x.s!='i').sort((a,b)=>a.d-b.d);
   return out(u.length?'Units expiring within 7 days:\n'+u.map(x=>`• ${x.code}: ${COMP[x.k]} ${x.g.replace('-','−')}, ${dt(x.d)}`).join('\n'):'No units expire within 7 days.',{t:'open_screen',v:'m-inv',l:'Details are on the Inventory screen.',b:'Open Inventory'})}
  if(rx('new|incoming|request',n)){bot('/inbox/requests');const L=inb().filter(r=>r.p<2);return out(L.length?`${L.length} request${L.length>1?'s':''} waiting for a reply:\n`+L.map(r=>`• Request ${r.id}: ${r.q} unit${r.q>1?'s':''} ${bg(r.g)} ${COMP[r.k]}, ${r.pr}`).join('\n'):'No new requests.',{t:'open_screen',v:'m-in',l:'Reply to a request on the Requests screen.',b:'Open Requests'})}
  return out('I can summarise new requests, stock of a blood group, and units close to expiry.')}
 if(R!='lab'||1){
  if(rx("can i|may i|am i|blood pressure|diabet|medication|medicine|pregnan|anaemi|anemi|haemoglobin|hemoglobin|illness|disease",n))return out('That is a medical question and I cannot judge eligibility. Please ask the physician at the nearest donation centre.');
  if(R=='don'&&rx('nearest|closest|where|centre|center|location',n)){bot('/public/centers');const L=D.centers.filter(c=>c.c).sort((a,b)=>a.km-b.km).slice(0,2);return out('Nearest licensed collection centres:\n'+L.map(c=>`• ${c.n}: ${c.km} km, hours ${c.h}`).join('\n'))}
  const a=D.kb.find(x=>rx(x.p,n));if(a)return out(`${a.a}\n\nSource: approved content, last reviewed ${a.r}.`);
  return out('I could not find a confirmed answer in the approved content. Try one of these, or contact the centre:\n'+D.kb.slice(0,3).map(x=>'• '+x.q).join('\n'))}}
render();renderChat();
</script>
